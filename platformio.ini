; PlatformIO Project Configuration File
; AquaControl: ESP32 ODrive S1 Closed-Loop Motor Controller (PID / Fuzzy / Manual)

[platformio]
default_envs = esp32dev

[env]
build_src_filter = +<*> -<test_odrive_uart.cpp>

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Configurar Flash de 4MB para ESP32-S3 SuperMini
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv

build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

[env:esp32-s3-tx12-rx13]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 4MB
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DODRIVE_SERIAL_TX_PIN=12
    -DODRIVE_SERIAL_RX_PIN=13
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

[env:test-odrive]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = 
    +<odrive_uart.cpp>
    +<test_odrive_uart.cpp>

; ============================================================
; Virtual ODrive Environments for Web Dashboard Testing
; Simulates motor dynamics, bypasses physical UART and ESP-NOW
; Runs autonomously on bare ESP32 without peripherals
; ============================================================
[env:esp32dev-virtual]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DODRIVE_VIRTUAL=1
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

[env:esp32-s3-virtual]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 4MB
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DODRIVE_VIRTUAL=1
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

; ============================================================
; LilyGO T3 LoRa32 (v1.6)
; Hardware: LilyGO LoRa32 + Custom Instrumentation HAT
; ============================================================
[env:lilygo-lora32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
build_flags =
    -DBOARD_LILYGO_LORA32
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

[env:lilygo-lora32-virtual]
extends = env:lilygo-lora32
build_flags =
    -DBOARD_LILYGO_LORA32
    -DODRIVE_VIRTUAL=1


