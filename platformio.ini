; PlatformIO Project Configuration File
; AquaControl: ESP32 ODrive S1 Closed-Loop Motor Controller (PID / Fuzzy / Manual)

[platformio]
default_envs = esp32dev

[env]
build_src_filter = +<*> -<test_odrive_uart.cpp> -<verify_odrive.cpp>
board_build.partitions = min_spiffs.csv

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_flags =
    --no-stub

; Configurar Flash de 4MB para ESP32-S3 SuperMini
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv

build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

[env:test-odrive]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = 
    +<odrive_uart.cpp>
    +<test_odrive_uart.cpp>

; ============================================================
; ODrive Data Verification Environment (ESP32-S3)
; Reads 6 telemetry variables and prints them as CSV.
; Compare side-by-side with tools/odrive_monitor.py (USB).
; No WiFi, no cloud, no SD, no control logic.
; Flash: pio run -e esp32-s3-verify -t upload
; Monitor: pio device monitor -e esp32-s3-verify
; ============================================================
[env:esp32-s3-verify]
extends = env:esp32-s3
build_src_filter =
    +<odrive_uart.cpp>
    +<verify_odrive.cpp>

; ============================================================
; Virtual ODrive Environments for Web Dashboard Testing
; Simulates motor dynamics, bypasses physical UART and ESP-NOW
; Runs autonomously on bare ESP32 without peripherals
; ============================================================
[env:esp32dev-virtual]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DODRIVE_VIRTUAL=1
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

[env:esp32-s3-virtual]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_flags =
    --no-stub
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DODRIVE_VIRTUAL=1
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

; ============================================================
; LilyGO T3 LoRa32 (v1.6)
; Hardware: LilyGO LoRa32 + Custom Instrumentation HAT
; ============================================================
[env:lilygo-lora32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
build_flags =
    -DBOARD_LILYGO_LORA32
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

[env:lilygo-lora32-virtual]
extends = env:lilygo-lora32
build_flags =
    -DBOARD_LILYGO_LORA32
    -DODRIVE_VIRTUAL=1

; ============================================================
; Over-The-Air (OTA) Wireless Upload Environments
; Usage: pio run -t upload -e esp32-s3-ota
; Or override IP: pio run -t upload -e esp32-s3-ota --upload-port 192.168.137.170
; ============================================================
[env:esp32-s3-ota]
extends = env:esp32-s3
upload_protocol = espota
upload_port = aquacontrol-odrive.local
upload_flags =
    --port=3232
    --timeout=60

[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = aquacontrol-odrive.local
upload_flags =
    --port=3232
    --timeout=60

[env:lilygo-lora32-ota]
extends = env:lilygo-lora32
upload_protocol = espota
upload_port = aquacontrol-odrive.local
upload_flags =
    --port=3232
    --timeout=60





